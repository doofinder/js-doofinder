name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run linter
      run: yarn lint
      
    - name: Run tests
      run: yarn test
      
    - name: Build project
      run: yarn build
      
    - name: Check build artifacts
      run: |
        test -d lib
        test -d browser
        test -d commonjs
        test -f lib/index.js
        test -f lib/doofinder.d.ts
        test -f browser/doofinder.js
        test -f browser/doofinder.min.js
        test -f commonjs/index.js
